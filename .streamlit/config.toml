[theme]
base = "dark"
primaryColor = "#b7f56c"
backgroundColor = "#0c131d"
secondaryBackgroundColor = "#14202e"
textColor = "#edf3fb"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
maxUploadSize = 30

[runner]
# Full generation-2 collection after every live metrics update stalls all
# Python threads with the pose model loaded. Keep normal automatic GC enabled.
postScriptGC = false
